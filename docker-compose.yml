services:

  pocketbase:
    build:
      context: .
      dockerfile: Dockerfile.pocketbase
      args:
        PB_VERSION: ${PB_VERSION}
    volumes:
      - pocketbase_data:/pb/pb_data
    networks:
      - internal
      - bw-services
    ports:
      - "127.0.0.1:8091:8090"
    restart: unless-stopped

  steinbp:
    build:
      context: .
      args:
        VITE_POCKETBASE_URL: ${VITE_POCKETBASE_URL}
    depends_on:
      - pocketbase
    networks:
      - internal
      - bw-services
    ports:
      - "${APP_PORT:-80}:80"
    restart: unless-stopped
    labels:
      # PocketBase filter syntax (quotes, ||) déclenche les règles SQLi de ModSecurity → désactivé
      - "bunkerweb.USE_MODSECURITY=no"
      # Allow all HTTP methods needed by PocketBase (BunkerWeb blocks DELETE/PATCH/PUT by default)
      - "bunkerweb.ALLOWED_METHODS=GET|POST|PUT|PATCH|DELETE|HEAD|OPTIONS"

networks:
  internal:
    driver: bridge
  bw-services:
    external: true

volumes:
  pocketbase_data:
