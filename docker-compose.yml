services:

  pocketbase:
    build:
      context: .
      dockerfile: Dockerfile.pocketbase
      args:
        PB_VERSION: ${PB_VERSION}
    volumes:
      - pocketbase_data:/pb/pb_data
    environment:
      PB_SUPERUSER_EMAIL: ${PB_SUPERUSER_EMAIL:?PB_SUPERUSER_EMAIL doit être défini}
      PB_SUPERUSER_PASSWORD: ${PB_SUPERUSER_PASSWORD:?PB_SUPERUSER_PASSWORD doit être défini}
    networks:
      - internal
    ports:
      - "8091:8090"
    restart: unless-stopped

  steinbp:
    build:
      context: .
      args:
        VITE_POCKETBASE_URL: ${VITE_POCKETBASE_URL}
    depends_on:
      - pocketbase
    networks:
      - internal
    ports:
      - "${APP_PORT:-80}:80"
    restart: unless-stopped

networks:
  internal:
    driver: bridge

volumes:
  pocketbase_data:
