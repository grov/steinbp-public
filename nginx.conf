server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # IP client réelle transmise par le reverse proxy amont (BunkerWeb).
    # Seuls les réseaux privés sont considérés comme proxys de confiance :
    # un X-Forwarded-For envoyé directement par un client public est ignoré.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Proxy vers PocketBase (API + admin UI)
    location ~ ^/(api|_)/ {
        proxy_pass http://pocketbase:8090;
        proxy_set_header Host $host;
        # Seul header d'IP lu par PocketBase (rate limiting) : toujours écrasé ici.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 10m;
    }

    # Assets Vite (noms hashés) — cache long terme
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html — jamais mis en cache (pointe toujours vers les bons assets)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    # React SPA — toujours servir index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
